<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <title>Verifica mail - Organizr</title>
    <link rel="icon" href="../assets/img/favicon/favicon-organizr.png">
    <link rel="canonical" href="https://organizr.it/mail-verificata/">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.min.css?v=f88ca355c5">
    <style>
        .verification-wrap { min-height:100svh; display:flex; flex-direction:column; }
        .verification-main { flex:1; display:grid; place-items:center; padding:32px 20px 80px; }
        .verification-card { width:min(100%, 520px); padding:44px 36px; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-xl); box-shadow:var(--shadow); }
        .verification-mark { width:72px; height:72px; margin:0 auto 24px; display:grid; place-items:center; border-radius:50%; background:var(--accent-soft); color:var(--accent-2); }
        .verification-mark svg { width:32px; height:32px; }
        .verification-mark[data-state="success"] { background:rgba(0,210,150,.14); color:#00d296; }
        .verification-mark[data-state="error"] { background:rgba(255,85,85,.14); color:#ff8585; }
        .verification-card h1 { font-size:clamp(1.5rem, 5vw, 2rem); letter-spacing:-.04em; line-height:1.3; margin:0 0 14px; max-width:none; }
        .verification-card p { color:var(--muted); line-height:1.7; margin:0; }
        .verification-card button { margin-top:24px; font:inherit; cursor:pointer; }
        .verification-card button[hidden] { display:none; }
        .verification-footer { text-align:center; padding:0 20px 24px; }
        .verification-footer .footer-links { justify-content:center; }
        @media(max-width:480px) { .verification-card { padding:32px 22px; } }
    </style>
</head>
<body>
    <div class="verification-wrap">
        <div class="page-shell">
            <header class="site-header">
                <a class="logo" href="../" aria-label="Organizr home"><img src="../assets/img/logo/organizer-logo-black.png" alt="Organizr" width="1275" height="351"></a>
                <nav class="top-nav" aria-label="Organizr"><a href="../">Home</a></nav>
            </header>
        </div>
        <main class="verification-main">
            <section class="verification-card" aria-labelledby="verification-title" aria-live="polite" aria-busy="true">
                <div class="verification-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path id="verification-symbol" d="M4 6h16v12H4z M4 6l8 6 8-6"/></svg>
                </div>
                <h1 id="verification-title">Verifica della mail in corso…</h1>
                <p id="verification-message">Attendi qualche istante.</p>
                <button id="verification-retry" type="button" class="btn btn-primary" hidden>Riprova</button>
                <noscript><p>Per verificare la mail, abilita JavaScript e riapri il link ricevuto via email.</p></noscript>
            </section>
        </main>
        <footer class="verification-footer">
            <div class="footer-links"><a id="verification-support" href="../it/support/">Assistenza</a><a id="verification-privacy" href="../it/privacy-policy/">Privacy</a><a id="verification-blog" href="../it/blog/">Blog</a></div>
              <a href="https://billing.stripe.com/p/login/dRm00i3W28G77Dm29X7wA01" target="_blank" rel="noopener noreferrer">Gestisci abbonamento</a>
        </footer>
    </div>
    <script>
    (function () {
        'use strict';
        var params = new URLSearchParams(window.location.hash.slice(1));
        var token = params.get('token') || '';
        var lang = params.get('lang') || (navigator.language || 'en').split('-')[0];
        if (!['it', 'en', 'es', 'de'].includes(lang)) lang = 'en';
        // Keep the secret in memory only, including when the user retries.
        history.replaceState(null, '', window.location.pathname);
        var copy = {
            it: { title:'Verifica mail - Organizr', loading:'Verifica della mail in corso…', wait:'Attendi qualche istante.', success:'La mail è stata verificata correttamente', done:'Puoi tornare sull’app.', invalid:'Link non valido o scaduto', newLink:'Torna nelle impostazioni dell’app e richiedi una nuova email di verifica.', failed:'Verifica non riuscita', network:'Non riusciamo a completare la verifica in questo momento. Riprova tra poco.', retry:'Riprova', support:'Assistenza' },
            en: { title:'Verify email - Organizr', loading:'Verifying your email…', wait:'Please wait a moment.', success:'Your email has been verified successfully', done:'You can return to the app.', invalid:'Invalid or expired link', newLink:'Return to the app settings and request a new verification email.', failed:'Verification failed', network:'We cannot complete verification right now. Please try again shortly.', retry:'Try again', support:'Support' },
            es: { title:'Verificar correo - Organizr', loading:'Verificando tu correo…', wait:'Espera un momento.', success:'Tu correo se ha verificado correctamente', done:'Puedes volver a la app.', invalid:'Enlace no válido o caducado', newLink:'Vuelve a los ajustes de la app y solicita un nuevo correo de verificación.', failed:'La verificación ha fallado', network:'No podemos completar la verificación en este momento. Inténtalo de nuevo en breve.', retry:'Reintentar', support:'Ayuda' },
            de: { title:'E-Mail bestätigen - Organizr', loading:'Deine E-Mail-Adresse wird bestätigt…', wait:'Bitte warte einen Moment.', success:'Deine E-Mail-Adresse wurde erfolgreich bestätigt', done:'Du kannst zur App zurückkehren.', invalid:'Ungültiger oder abgelaufener Link', newLink:'Gehe zurück zu den App-Einstellungen und fordere eine neue Bestätigungs-E-Mail an.', failed:'Bestätigung fehlgeschlagen', network:'Die Bestätigung kann gerade nicht abgeschlossen werden. Versuche es gleich erneut.', retry:'Erneut versuchen', support:'Hilfe' }
        }[lang];
        document.documentElement.lang = lang;
        document.title = copy.title;
        var card = document.querySelector('.verification-card');
        var mark = document.querySelector('.verification-mark');
        var heading = document.getElementById('verification-title');
        var message = document.getElementById('verification-message');
        var symbol = document.getElementById('verification-symbol');
        var retry = document.getElementById('verification-retry');
        retry.textContent = copy.retry;
        document.getElementById('verification-support').textContent = copy.support;
        if (lang !== 'it') {
            document.getElementById('verification-support').href = '../support/';
            document.getElementById('verification-privacy').href = '../privacy-policy/';
            document.getElementById('verification-blog').href = '../blog/';
        }
        function render(state, title, text, canRetry) {
            mark.dataset.state = state;
            heading.textContent = title;
            message.textContent = text;
            card.setAttribute('aria-busy', state === 'loading' ? 'true' : 'false');
            retry.hidden = !canRetry;
            symbol.setAttribute('d', state === 'success' ? 'M5 12l4 4L19 6' : state === 'error' ? 'M6 6l12 12M6 18L18 6' : 'M4 6h16v12H4z M4 6l8 6 8-6');
        }
        async function verify() {
            if (!/^[A-Za-z0-9_-]{43}$/.test(token)) {
                render('error', copy.invalid, copy.newLink, false);
                return;
            }
            render('loading', copy.loading, copy.wait, false);
            var controller = new AbortController();
            var timeout = setTimeout(function () { controller.abort(); }, 15000);
            try {
                var response = await fetch('https://organizr-api.wonder-web.it/api/v1/auth/verify-email/link', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({token:token}), signal:controller.signal,
                    credentials:'omit', cache:'no-store', referrerPolicy:'no-referrer'
                });
                var data = await response.json();
                if (response.ok && data.ok === true) {
                    token = '';
                    render('success', copy.success, copy.done, false);
                } else if (response.status === 400 || response.status === 410) {
                    token = '';
                    render('error', copy.invalid, copy.newLink, false);
                } else {
                    render('error', copy.failed, copy.network, true);
                }
            } catch (_) { render('error', copy.failed, copy.network, true); }
            finally { clearTimeout(timeout); }
        }
        retry.addEventListener('click', verify);
        verify();
    })();
    </script>
</body>
</html>
